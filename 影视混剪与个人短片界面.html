<!DOCTYPE html>
<meta charset="UTF-8">
<title>影视混剪与个人短片</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Microsoft YaHei,sans-serif;background:linear-gradient(135deg,#0c0a20,#1a163a,#251f4a);color:#e0e0ff;min-height:100vh;padding:60px 20px}
.container{max-width:1100px;margin:0 auto}
.title{font-size:32px;margin-bottom:40px;text-align:center;background:linear-gradient(90deg,#8860ff,#40e0ff);-webkit-background-clip:text;color:transparent}

/* 统一两行两列网格布局 */
.grid{
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap:30px;
  margin-bottom: 50px;
}

/* 分类大标题 */
.section-title{
  font-size:20px;
  color:#fff;
  margin-bottom:20px;
  font-weight:bold;
}

.item{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.label{
  font-size:17px;
  font-weight:bold;
  color:#ffffff;
  line-height:1.4;
}
.desc{
  font-size:14px;
  color:#b8b0d4;
  line-height:1.5
}

/* 视频容器：统一大小 + 自定义封面 */
.video-wrapper {
  position: relative;
  width: 100%;
  border-radius: 16px;
  overflow: hidden;
  box-shadow:0 0 30px rgba(136,96,255,.2);
  aspect-ratio: 16 / 9;
  cursor: pointer;
}

/* 自定义封面图 */
.video-cover {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 2;
}

/* 播放按钮 */
.play-btn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 70px;
  height: 70px;
  background: rgba(136,96,255,0.9);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 3;
}
.play-btn::after {
  content: "";
  border-left: 24px solid #fff;
  border-top: 14px solid transparent;
  border-bottom: 14px solid transparent;
  margin-left: 6px;
}

/* B站视频iframe */
.video-iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: 0;
  z-index: 1;
}

.back{
  position:fixed;bottom:30px;right:30px;
  padding:12px 24px;
  background:linear-gradient(90deg,#8860ff,#40e0ff);
  color:#fff;
  border-radius:50px;
  text-decoration:none
}
</style>

<script>
// 点击封面 → 隐藏封面 + 播放视频
function playVideo(el) {
  let cover = el.querySelector('.video-cover');
  let btn = el.querySelector('.play-btn');
  let iframe = el.querySelector('.video-iframe');

  cover.style.display = 'none';
  btn.style.display = 'none';

  // 自动播放 + 高清画质
  iframe.src += "&autoplay=1";
}
</script>+
